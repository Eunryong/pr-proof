[project]
name = "pr-proof"
version = "0.1.0"
description = "PR의 협업 규칙 위반을 검출하고, 테스트로 검증한 수정안을 제안 PR로 올리는 로컬 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "redis>=5.2",
    "rq>=2.0",
    "langgraph>=0.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "honcho>=2.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"  # Docker·GitHub이 필요한 테스트는 pytest -m docker로 따로 돌린다
markers = ["docker: Docker가 필요한 통합 테스트 (없으면 건너뛴다)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
