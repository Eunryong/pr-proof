[project]
name = "pr-proof"
version = "0.1.0"
description = "PR의 협업 규칙 위반을 검출하고, 테스트로 검증한 수정안을 제안 PR로 올리는 로컬 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "redis>=5.2",
    "rq>=2.0",
    "langgraph>=0.2",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
    "langgraph-checkpoint-sqlite>=2.0",
    "defusedxml>=0.7",
    "diff-cover>=11.0",
]

[project.optional-dependencies]
# 과거 기록 검색 (docs/DESIGN.md 6.5). rag.enabled인 저장소의 검사에서만 import한다.
# 임베딩은 onnxruntime과 tokenizers로 로컬에서 계산하고 모델 파일은 판과 해시를 고정해 받는다
rag = [
    "chromadb==1.5.9",
    "onnxruntime==1.31.1",
    "tokenizers==0.23.3",
    "numpy==2.4.6",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "honcho>=2.0",
    "httpx>=0.27",
    "fakeredis>=2.26",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"  # Docker·GitHub이 필요한 테스트는 pytest -m docker로 따로 돌린다
markers = ["docker: Docker가 필요한 통합 테스트 (없으면 건너뛴다)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
