name: pr-edits-readme
description: >-
  PR이 README에서 print 규칙 문장을 지우면서 print를 넣었다. 규칙은 base에서 읽으므로 그 PR에도
  print 규칙이 적용된다.
pr:
  - file: README.md
    find: "- `orders/` 아래 모듈은 `print`를 쓰지 않는다. 남길 것이 있으면 `logging`의 로거를 쓴다.\n"
    replace: ""
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
model:
  rules:
    - section: 코드 규칙 > 출력
      quote: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
      scope: ["orders/**"]
      checker:
        body: |
          id: no-print
          language: python
          severity: error
          message: orders/ 아래 모듈은 print를 쓰지 않는다
          rule:
            pattern: print($$$ARGS)
        examples:
          - {code: "print(1)\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print('o', o)\n", violates: true, lines: [2]}
          - {code: "logger.info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
expect:
  violations: ["orders/services/pricing.py:13"]
