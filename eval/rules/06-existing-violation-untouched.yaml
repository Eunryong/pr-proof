name: existing-violation-untouched
description: >-
  base에 print 위반이 원래 있고 PR은 그 줄을 건드리지 않는다. 같은 파일에 PR이 넣은 print만
  잡히고 base의 것은 잡히지 않는다.
base:
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
pr:
  - file: orders/services/pricing.py
    append: "\n\ndef log_total(order: Order) -> None:\n    print(\"total\", total(order))\n"
expect:
  violations: ["orders/services/pricing.py:32"]
  not_flagged: ["orders/services/pricing.py:13"]
