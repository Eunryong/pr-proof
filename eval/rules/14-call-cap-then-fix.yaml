name: call-cap-then-fix
description: >-
  호출 상한에 걸린 수정을 `/fix`로 이어 하기 (완료 기준 2-11). base의 `.pipeline.yaml`이 `pr_max`를 3으로
  낮춘다. 수정 판단 1회 뒤 가짜 수정 모델이 두 회차 모두 아무 파일도 바꾸지 않아, 세 번째 회차는 상한에
  걸리고 코멘트에 처리하지 못한 수정 건수가 나온다. `/fix`를 달면 PR 상한을 한 번 더 받아 새 시도
  세대로 고치고, 검증을 통과한 수정안 PR이 열린다.
scripted_only: true
pipeline:
  model:
    calls:
      pr_max: 3
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 기대값을 숫자로 직접 적는 코드라 이 규칙의 대상이 아니다
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
fix:
  edits:
    - []  # 1회차: 아무 파일도 바꾸지 않음 (검증이 재시도로 돌린다)
    - []  # 2회차: 같음. 3회차는 PR 상한(3)에 걸린다
    - - file: orders/services/pricing.py
        find: "order.coupon_percent > 50"
        replace: "order.coupon_percent > MAX_COUPON_PERCENT"
  answer:
    summary: 쿠폰 비율의 상한 50을 원래 있던 MAX_COUPON_PERCENT로 되돌림
    changes:
      - {file: orders/services/pricing.py, line: 13, rule: 0, why: 비교의 기준값을 상수로 쓴다}
expect:
  violations: ["orders/services/pricing.py:13"]
  fix: budget
  contains:
    - "**수정안:** 모델 호출 상한에 걸려 처리하지 못함: 수정 1건"
    - "`/fix`로 다시 돌릴 수 있습니다."
  fix_command:  # 결과 코멘트를 본 사람이 `/fix`를 단다 (2-11)
    command: /fix
    fix: ready
    fix_file: orders/services/pricing.py
    same_as_base: true
    contains: ["수정 작성: 모델 호출 1회, 회차 1"]
    absent: ["처리하지 못함"]
