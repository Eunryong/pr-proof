name: old-static-05-failing-tests
description: >-
  옛 static 05를 README 규칙 케이스로 옮긴 것. PR이 매직 값을 넣으면서 테스트도 깨뜨렸다. 위반은
  그대로 보이지만 테스트로 확인할 수 없으므로 수정 판단의 표가 직접 고쳐야 함(테스트가 실패함)으로 정하고, 수정 모델을
  부르지 않으며 수정안 PR이 없다.
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
  - file: orders/services/pricing.py
    find: "FREE_SHIPPING_MIN = 50_000"
    replace: "FREE_SHIPPING_MIN = 1"
expect:
  violations: ["orders/services/pricing.py:13"]
  contains:
    - "  직접 고쳐야 함 1건 · 테스트가 실패해 고친 것을 확인할 수 없으므로 수정안을 만들지 않았습니다."
    - "  - `orders/services/pricing.py:13`\n"
  fix: none
