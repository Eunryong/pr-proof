name: import-direction
description: >-
  "`orders/services`는 `orders/api`를 import하지 않는다." 규칙. `import`와 `from … import`가 둘 다
  잡히고, 반대 방향(api가 services를 import)은 잡히지 않는다.
pr:
  - file: orders/services/pricing.py
    find: "from orders.models.order import Order\n"
    replace: "from orders.models.order import Order\nimport orders.api.handlers\nfrom orders.api.handlers import quote\n"
  - file: orders/api/handlers.py
    find: "from orders.services.pricing import total\n"
    replace: "from orders.services.pricing import shipping_fee, total\n"
expect:
  violations: ["orders/services/pricing.py:2", "orders/services/pricing.py:3"]
  not_flagged: ["orders/api/handlers.py:2"]
  contains: ["출처: `README.md > 코드 규칙 > 의존 방향`"]
