name: old-static-03-uncovered
description: >-
  테스트가 부르지 않는 새 함수의 매직 값 (완료 기준 2-7). 수정 판단의 표가 이 줄을 막지 않아 수정안이 재검사와 테스트를 통과해 수정안 PR로 올라간다. base의
  `.pipeline.yaml`에 없앤 키 `fix.require_covered: true`가 있어도 오류 없이 무시하고 "설정:"에 알린다(4.6, 10절). 모델이 테스트를
  만들어 확인했는지는 rules/32가 본다.
pipeline:
  fix:
    require_covered: true
pr:
  - file: orders/services/pricing.py
    append: "\n\ndef is_bulk(order: Order) -> bool:\n    return len(order.items) > 10\n"
expect:
  violations: ["orders/services/pricing.py:31"]
  contains:
    - "· 수정안 #900"
  body_contains: ["`fix.require_covered`는 없어졌습니다"]
  fix: ready
  fix_file: orders/services/pricing.py
  pr_contains:
    - "  - `orders/services/pricing.py` 줄 31"
