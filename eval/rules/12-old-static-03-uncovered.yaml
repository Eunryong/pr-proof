name: old-static-03-uncovered
description: >-
  옛 static 03을 README 규칙 케이스로 옮긴 것 (완료 기준 2-7). 테스트가 부르지 않는 새 함수의 매직
  값이다. 2026-11-21 전에는 수정 판단의 표가 skip(테스트가 지나가지 않음)으로 정했다. 지금은 표가 막지
  않고 수정 판단이 fix로 정해, 가짜 모델이 기준값을 새 모듈 상수로 바꾼 수정안이 재검사와 테스트를
  통과해 수정안 PR로 올라간다. 수정안 PR 본문과 결과 코멘트는 그 줄을 실행하는 테스트가 없다고 적는다.
  base의 `.pipeline.yaml`에 없앤 키 `fix.require_covered: true`가 있어도 오류 없이 무시하고 "설정:"에
  알린다(4.6, 10절).
pipeline:
  fix:
    require_covered: true
pr:
  - file: orders/services/pricing.py
    append: "\n\ndef is_bulk(order: Order) -> bool:\n    return len(order.items) > 10\n"
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 기대값을 숫자로 직접 적는 코드라 이 규칙의 대상이 아니다
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
fix:
  edits:
    - - file: orders/services/pricing.py
        find: "\n\ndef is_bulk"
        replace: "\n\nBULK_MIN_ITEMS = 10\n\n\ndef is_bulk"
      - file: orders/services/pricing.py
        find: "len(order.items) > 10"
        replace: "len(order.items) > BULK_MIN_ITEMS"
  answer:
    summary: 대량 주문의 기준 10을 모듈 상수로 옮김
    changes:
      - {file: orders/services/pricing.py, line: 30, rule: 0, why: 비교의 기준값을 둘 상수}
      - {file: orders/services/pricing.py, line: 34, rule: 0, why: 비교의 기준값을 상수로 쓴다}
expect:
  violations: ["orders/services/pricing.py:31"]
  contains:
    - "· 수정안 #900 · 이 줄을 실행하는 테스트가 없음"
    - "고친 위반 중 1건은 그 줄을 실행하는 테스트가 없거나 알 수 없어"
  body_contains: ["`fix.require_covered`는 없어졌습니다"]
  fix: ready
  fix_file: orders/services/pricing.py
  pushed_contains: ["BULK_MIN_ITEMS = 10", "len(order.items) > BULK_MIN_ITEMS"]
  pr_contains:
    - "  - `orders/services/pricing.py:31` · 이 줄을 실행하는 테스트가 없음"
    - "- 테스트가 실행하지 않는 줄: 고친 위반 중 1건은"
