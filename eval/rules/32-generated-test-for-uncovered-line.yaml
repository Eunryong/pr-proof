name: generated-test-for-uncovered-line
description: >-
  있던 테스트가 실행하지 않는 줄의 위반을 모델이 테스트를 만들어 확인하며 고친다 (2026-11-22, DESIGN 4.7,
  4.8의 6번). PR이 더한 `is_bulk`의 `> 10`은 README의 상수 규칙을 어기고, 있던 테스트는 이 함수를 부르지
  않는다. 수정을 쓰는 모델은 고치기 전에 그 줄을 실행하는 테스트를 tests/test_pipeline_<이름>.py로 쓰고
  파이프라인 도구로 돌려 본 뒤 고친다. 출구 검사가 그 테스트를 받아들여 수정안 PR에 같이 올라가고, 표시는
  "만든 테스트가 실행함"이다. 규칙 읽기와 검사기 작성의 호출을 줄이려고
  base의 README를 상수 규칙 하나로 바꾸고 모든 단계를 가벼운 모델로 둔다. 기대는 글이 아니라 결과다:
  위반 위치, 수정안이 올라갔는가, 만든 테스트가 올라갔는가, 대상 위반의 실행 상태.
pipeline:
  model: {rules: haiku, checker: haiku, decide: haiku, judge: haiku, light: haiku, heavy: haiku}
base:
  - file: README.md
    create: |
      # orders

      주문 금액을 계산하는 작은 Python 프로젝트.

      ## 코드 규칙

      ### 상수

      - 비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다.

      지키는 예:

      ```python
      MAX_COUPON_PERCENT = 50

      if order.coupon_percent > MAX_COUPON_PERCENT:
          raise ValueError("coupon_percent out of range")
      ```

      어기는 예:

      ```python
      if order.coupon_percent > 50:
          raise ValueError("coupon_percent out of range")
      ```
pr:
  - file: orders/services/pricing.py
    append: "\n\ndef is_bulk(order: Order) -> bool:\n    return len(order.items) > 10\n"
expect:
  violations: ["orders/services/pricing.py:31"]
  fix: ready
  fix_file: orders/services/pricing.py
  generated_tests: true
  pr_contains: ["만든 테스트가 실행함", "- 만든 테스트 1개"]
