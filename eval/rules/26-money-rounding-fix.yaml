name: money-rounding-fix
description: >-
  README 금액 규칙의 모델 수정 케이스 (6단계 모델 비교의 표본). PR이 할인을 `round(... / 100)`(원 단위 반올림)으로 바꾸고 반올림을 확인하는 테스트를
  더한다. 규칙대로 `/`를 `//`로만 바꾸면 내림이 되어 PR의 테스트가 깨진다. 맞는 수정은 `float`·`/`·`round` 없이 정수 연산으로 반올림을 지키는
  것이다(예: `+ 50) // 100`).
pr:
  - file: orders/services/pricing.py
    find: "return subtotal(order) * order.coupon_percent // 100"
    replace: "return round(subtotal(order) * order.coupon_percent / 100)"
  - file: tests/test_pricing.py
    append: |


      def test_discount_rounds_to_nearest_won():
          assert discount(order(999, coupon=33)) == 330
expect:
  violations: ["orders/services/pricing.py:15"]
  fix: ready
  fix_file: orders/services/pricing.py
  pr_contains: ["- 규칙 재검사: 대상 위반 1건 해소, 새 위반 없음"]
