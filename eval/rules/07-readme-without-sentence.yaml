name: readme-without-sentence
description: >-
  base의 README에서 print 규칙 문장을 지웠다. 모델이 그 규칙을 답해도 원문 확인에서 버려져 적용되지
  않는다. 남은 규칙(데이터 클래스)은 그대로 검사한다.
base:
  - file: README.md
    find: "- `orders/` 아래 모듈은 `print`를 쓰지 않는다. 남길 것이 있으면 `logging`의 로거를 쓴다.\n"
    replace: ""
pr:
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
model:
  rules:
    - section: 코드 규칙 > 출력
      quote: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
      scope: ["orders/**"]
      checker:
        body: |
          id: no-print
          language: python
          severity: error
          message: orders/ 아래 모듈은 print를 쓰지 않는다
          rule:
            pattern: print($$$ARGS)
        examples:
          - {code: "print(1)\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print('o', o)\n", violates: true, lines: [2]}
          - {code: "logger.info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
    - section: 코드 규칙 > 모델
      quote: "`orders/models`의 데이터 클래스는 `@dataclass(frozen=True)`로 선언한다."
      scope: ["orders/models/**"]
      checker:
        body: |
          id: dataclass-frozen
          language: python
          severity: error
          message: 데이터 클래스는 frozen=True로 선언한다
          rule:
            kind: decorator
            regex: "^@dataclass\\s*$"
        examples:
          - {code: "@dataclass\nclass A:\n    x: int\n", violates: true, lines: [1]}
          - {code: "@dataclass\nclass B:\n    y: str\n", violates: true, lines: [1]}
          - {code: "@dataclass(frozen=True)\nclass C:\n    x: int\n", violates: false, lines: []}
          - {code: "class D:\n    x: int\n", violates: false, lines: []}
expect:
  violations: []
  not_flagged: ["orders/services/pricing.py:13"]
  absent: ["`print`를 쓰지 않는다"]
