name: readme-without-sentence
description: >-
  base의 README에서 print 규칙 문장을 지웠다. 모델이 그 규칙을 답해도 원문 확인에서 버려져 적용되지
  않는다. 남은 규칙(데이터 클래스)은 그대로 검사한다.
base:
  - file: README.md
    find: "- `orders/` 아래 모듈은 `print`를 쓰지 않는다. 남길 것이 있으면 `logging`의 로거를 쓴다.\n"
    replace: ""
pr:
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
expect:
  violations: []
  not_flagged: ["orders/services/pricing.py:13"]
  absent: ["`print`를 쓰지 않는다"]
