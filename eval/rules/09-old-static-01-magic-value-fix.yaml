name: old-static-01-magic-value-fix
description: >-
  옛 static 01(매직 값)을 README 규칙 케이스로 옮긴 것 (완료 기준 2-1, 2-9). README의 "비교에 쓰는
  기준값은 숫자를 직접 쓰지 않는다" 규칙의 검사기가 PR의 `> 50`과 `>= 50_000`을 잡는다. 수정 판단은
  `> 50`을 fix, `>= 50_000`을 skip으로 정한다. 가짜 모델이 `> 50`을 원래 상수로 되돌린 수정안이
  재검사와 테스트를 통과해 수정안 PR로 올라가고, skip한 줄은 코멘트에 이유와 함께 남고 수정안에는
  들어가지 않는다.
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
  - file: orders/services/pricing.py
    find: "discount(order) >= FREE_SHIPPING_MIN"
    replace: "discount(order) >= 50_000"
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 기대값을 숫자로 직접 적는 코드라 이 규칙의 대상이 아니다
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
  skip:  # 수정 판단이 skip으로 답할 위반 (나머지는 fix)
    orders/services/pricing.py:21: 같은 값의 상수가 이미 있지만 이름을 사람이 확인해야 한다
fix:  # 가짜 수정 모델: 회차마다 edits의 다음 편집을 모델 폴더에 적용하고 answer를 마지막 답으로 낸다
  edits:
    - - file: orders/services/pricing.py
        find: "order.coupon_percent > 50"
        replace: "order.coupon_percent > MAX_COUPON_PERCENT"
  answer:
    summary: 쿠폰 비율의 상한 50을 원래 있던 MAX_COUPON_PERCENT로 되돌림
    changes:
      - {file: orders/services/pricing.py, line: 13, rule: 0, why: 비교의 기준값을 상수로 쓴다}
expect:
  violations: ["orders/services/pricing.py:13", "orders/services/pricing.py:21"]
  contains:
    - "· skip (모델: `같은 값의 상수가 이미 있지만 이름을 사람이 확인해야 한다`)"
  fix: ready
  fix_file: orders/services/pricing.py
  pushed_contains: ["order.coupon_percent > MAX_COUPON_PERCENT", "discount(order) >= 50_000"]
  pr_contains:
    - "  - `orders/services/pricing.py:13`"
    - 수정 판단이 skip한 위반 1건은 이 수정안에 넣지 않았습니다
    - "- 규칙 재검사: 대상 위반 1건 해소, 새 위반 없음"
  pr_absent: ["orders/services/pricing.py:21"]
