name: fix-delivery-retry-recheck-rejection
description: >-
  수정안 PR의 한 생애 (완료 기준 2-3, 2-4, 2-6). 옛 static 01의 `> 50`을 README 규칙의 검사기가 잡고
  가짜 모델이 고친 수정안이 검증을 통과한다. 첫 전달(push)을 일부러 실패시키고 재시도하면 모델 호출
  기록이 늘지 않고 저장한 패치가 그대로 올라간다. 같은 커밋에 `/recheck`를 달면 모델 호출이 0이다.
  사람이 수정안 PR을 닫은 뒤 새 커밋을 올리면 거절 기록이 하나 남고 같은 줄은 직접 고쳐야 함(이전에 거절됨)이다.
scripted_only: true
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 기대값을 숫자로 직접 적는 코드라 이 규칙의 대상이 아니다
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
fix:
  edits:
    - - file: orders/services/pricing.py
        find: "order.coupon_percent > 50"
        replace: "order.coupon_percent > MAX_COUPON_PERCENT"
  answer:
    summary: 쿠폰 비율의 상한 50을 원래 있던 MAX_COUPON_PERCENT로 되돌림
    changes:
      - {file: orders/services/pricing.py, rule: 0, why: 비교의 기준값을 상수로 쓴다}
expect:
  violations: ["orders/services/pricing.py:13"]
  fix: ready
  fix_file: orders/services/pricing.py
  same_as_base: true
  pr_contains: ["- 규칙 재검사: 대상 위반 1건 해소, 새 위반 없음"]
  deliver_retry: true  # 첫 push를 일부러 실패시키고 RQ의 재시도처럼 다시 돌린다 (2-3)
  recheck_without_calls: true  # 같은 커밋에 /recheck (2-4)
  rejected_next_commit:  # 수정안 PR을 닫고 원본 PR에 새 커밋을 올린다 (2-6)
    edits:
      - file: orders/services/pricing.py
        append: "\n\n# 다음 커밋\n"
    contains: ["  - `orders/services/pricing.py:13` · 이전에 거절됨 (#900)"]
