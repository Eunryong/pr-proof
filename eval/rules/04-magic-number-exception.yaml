name: magic-number-exception
description: >-
  예외 문장이 붙은 규칙("…상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."). 추출한 규칙의
  인용에 예외 문장까지 남고, 바뀐 줄의 `> 0`과 `== 100`은 잡히지 않으며 `> 50`은 잡힌다. 문서가
  범위를 밝히지 않은 규칙이라 모델이 `tests/**`를 뺐고, tests/의 바뀐 줄은 잡히지 않는다.
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
  - file: orders/services/pricing.py
    append: "\n\ndef is_full_discount(order: Order) -> bool:\n    return order.coupon_percent == 100\n\n\ndef has_items(order: Order) -> bool:\n    return len(order.items) > 0\n"
  - file: tests/test_pricing.py
    append: "\n\ndef test_free_shipping_threshold():\n    assert subtotal(order(60_000)) > 50_000\n"
expect:
  violations: ["orders/services/pricing.py:13"]
  not_flagged:
    - orders/services/pricing.py:31
    - orders/services/pricing.py:35
    - tests/test_pricing.py:44
  contains:
    - 퍼센트 계산의 `100`은 예외다
    - "범위 추정: `tests/**` 제외 (문서에 범위 없음)"
