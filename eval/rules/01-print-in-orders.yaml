name: print-in-orders
description: >-
  "`orders/` 아래 모듈은 `print`를 쓰지 않는다." 규칙. PR이 orders/services에 넣은 print는 잡히고,
  orders/ 밖(scripts/)의 print는 잡히지 않는다. 같은 base의 두 번째 PR은 규칙 읽기와 검사기 작성의
  모델 호출이 0이다.
pr:
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
  - file: scripts/report.py
    create: "def main():\n    print(\"report\")\n"
expect:
  violations: ["orders/services/pricing.py:13"]
  not_flagged: ["scripts/report.py:2"]
  contains: ["출처: `README.md > 코드 규칙 > 출력`"]
  second_pr_without_calls: true
