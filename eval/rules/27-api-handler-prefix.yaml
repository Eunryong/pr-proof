name: api-handler-prefix
description: >-
  base README에 더한 "`orders/api`의 모듈 수준 함수 이름은 `handle_`로 시작한다." 이름 규칙(적용 범위
  orders/api). PR이 orders/api에 넣은 `compute_refund`는 잡히고, `handle_refund`와 그 안의 내부 함수,
  범위 밖(orders/services)의 함수는 잡히지 않는다.
base:
  - file: README.md
    find: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n"
    replace: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n\n### API\n\n- `orders/api`의 모듈 수준 함수 이름은 `handle_`로 시작한다.\n"
pr:
  - file: orders/api/handlers.py
    append: |


      def compute_refund(payload: dict) -> dict:
          return {"refund": payload.get("amount", 0)}


      def handle_refund(payload: dict) -> dict:
          def pick(key):
              return payload.get(key, 0)

          return {"refund": pick("amount")}
  - file: orders/services/refund.py
    create: "def compute_refund(amount: int) -> int:\n    return amount\n"
expect:
  violations: ["orders/api/handlers.py:14"]
  not_flagged: ["orders/api/handlers.py:18", "orders/api/handlers.py:19", "orders/services/refund.py:1"]
  contains: ["출처: `README.md > 코드 규칙 > API`"]
