name: generated-sample-without-validation
description: >-
  실행 결과나 생성물에 대한 규칙도 그 결과를 만드는 코드로 확인한다 (2026-11-22, DESIGN 4.3, 4.5). 규칙
  "생성된 모든 샘플은 validate_example 검증을 통과하고 verified 필드를 포함해야 한다"를 예전에는 규칙 읽기가
  "사람이 확인"으로 빼고 보이기만 했다. 이제는 코드 규칙으로 읽고, PR이 더한 생성 함수가 검증을 부르지
  않고 verified를 넣지 않으므로 그 줄이 위반이다. 실제 모델로만 돈다(가짜 답이 없다). 호출을 줄이려고
  규칙 문서를 이 규칙 하나만 든 GENERATION.md로 두고(`rules.docs`), 모든 단계를 가벼운 모델로, 수정은
  승인을 기다리게 한다(수정 작성을 부르지 않는다). 짝 케이스는 `34`(검증을 부르는 PR은 잡지 않는다).
real_only: true
pipeline:
  rules: {docs: [GENERATION.md]}
  fix: {require_approval: true}
  model: {rules: haiku, checker: haiku, decide: haiku, judge: haiku, light: haiku, heavy: haiku}
base:
  - file: GENERATION.md
    create: |
      # 데이터 생성

      ## 데이터 규칙

      - 생성된 모든 샘플은 `validators.validate_example` 검증을 통과하고 `"verified": true` 필드를 포함해야 한다.
  - file: data/validators.py
    create: |
      def validate_example(sample: dict) -> None:
          if sample["answer"] != eval(sample["question"]):
              raise ValueError("wrong answer")
  - file: data/generate.py
    create: |
      from data.validators import validate_example


      def make_addition(a: int, b: int) -> dict:
          sample = {"question": f"{a}+{b}", "answer": a + b, "verified": True}
          validate_example(sample)
          return sample
pr:
  - file: data/generate.py
    append: "\n\ndef make_subtraction(a: int, b: int) -> dict: return {\"question\": f\"{a}-{b}\", \"answer\": a - b}\n"
expect:
  violations: ["data/generate.py:10"]
