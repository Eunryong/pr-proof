name: money-signed-half-even-fix
description: >-
  README 금액 규칙의 모델 수정 케이스 (6단계 모델 비교에서 무거운 모델로 올라가는지 보는 표본). PR이
  부호가 있는 금액의 조정액을 `round(amount * percent / 100)`으로 더하고, 더한 테스트가 Python
  `round`의 반올림(0.5는 짝수 쪽)을 양수와 음수 모두에서 확인한다. 30과 달리 음수의 `//`는 아래로
  내리므로, 양수에서 맞는 정수 반올림이 음수에서 틀린다. 가짜 수정 모델은 두 번 그렇게 실패하고
  3회차에 부호를 따로 두는 짝수 쪽 반올림으로 지킨다. 기본 구성에서는 3회차가 무거운 모델의 회차다.
pr:
  - file: orders/services/pricing.py
    append: |


      def adjustment(amount: int, percent: int) -> int:
          return round(amount * percent / 100)
  - file: tests/test_pricing.py
    append: |


      def test_adjustment_rounds_half_to_even_for_both_signs():
          from orders.services.pricing import adjustment

          assert adjustment(250, 1) == 2
          assert adjustment(350, 1) == 4
          assert adjustment(-250, 1) == -2
          assert adjustment(-350, 1) == -4
          assert adjustment(-151, 1) == -2
          assert adjustment(-149, 1) == -1
          assert adjustment(999, 33) == 330
          assert adjustment(-999, 33) == -330
model:
  rules:
    - section: 코드 규칙 > 금액
      quote: "금액은 원 단위 정수(`int`)로 다룬다. `float`로 바꾸거나 `/`로 나누지 않고 `//`를 쓴다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 금액 계산 코드가 아니라 기대값을 적는 코드다
      checker:
        body: |
          id: money-int
          language: python
          severity: error
          message: 금액은 int로 다루고 / 대신 // 를 쓴다
          rule:
            any:
              - pattern: float($$$ARGS)
              - kind: binary_operator
                has:
                  field: operator
                  regex: "^/$"
        examples:
          - {code: "x = float(total)\n", violates: true, lines: [1]}
          - {code: "half = amount / 2\n", violates: true, lines: [1]}
          - {code: "half = amount // 2\n", violates: false, lines: []}
          - {code: "x = int(total) * 3\n", violates: false, lines: []}
fix:
  edits:
    - - file: orders/services/pricing.py
        find: "return round(amount * percent / 100)"
        replace: "return (amount * percent + 50) // 100"
    - - file: orders/services/pricing.py
        find: "return (amount * percent + 50) // 100"
        replace: "q, r = divmod(abs(amount * percent), 100)\n    q += r >= 50\n    return q if amount * percent >= 0 else -q"
    - - file: orders/services/pricing.py
        find: "return (amount * percent + 50) // 100"
        replace: "q, r = divmod(abs(amount * percent), 100)\n    q += r >= 50\n    return q if amount * percent >= 0 else -q"
      - file: orders/services/pricing.py
        find: "q += r >= 50"
        replace: "q += r > 50 or (r == 50 and q % 2 == 1)"
  answer:
    summary: 조정액을 정수 연산으로 바꾸고 양수·음수 모두 round와 같은 짝수 쪽 반올림을 지킴
    changes:
      - {file: orders/services/pricing.py, rule: 0, why: 금액을 float 없이 정수 연산으로 계산한다}
expect:
  violations: ["orders/services/pricing.py:31"]
  fix: ready
  fix_file: orders/services/pricing.py
  pushed_contains: ["return q if amount * percent >= 0 else -q"]
  pr_contains: ["- 규칙 재검사: 대상 위반 1건 해소, 새 위반 없음"]
