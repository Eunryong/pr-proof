name: money-signed-half-even-fix
description: >-
  README 금액 규칙의 모델 수정 케이스 (6단계 모델 비교에서 무거운 모델로 올라가는지 보는 표본). PR이 부호가 있는 금액의 조정액을 `round(amount *
  percent / 100)`으로 더하고, 더한 테스트가 Python `round`의 반올림(0.5는 짝수 쪽)을 양수와 음수 모두에서 확인한다. 30과 달리 음수의 `//`는
  아래로 내리므로, 양수에서 맞는 정수 반올림이 음수에서 틀린다. 맞는 수정은 부호를 따로 두고 짝수 쪽 반올림을 정수 연산으로 지키는 것이다.
pr:
  - file: orders/services/pricing.py
    append: |


      def adjustment(amount: int, percent: int) -> int:
          return round(amount * percent / 100)
  - file: tests/test_pricing.py
    append: |


      def test_adjustment_rounds_half_to_even_for_both_signs():
          from orders.services.pricing import adjustment

          assert adjustment(250, 1) == 2
          assert adjustment(350, 1) == 4
          assert adjustment(-250, 1) == -2
          assert adjustment(-350, 1) == -4
          assert adjustment(-151, 1) == -2
          assert adjustment(-149, 1) == -1
          assert adjustment(999, 33) == 330
          assert adjustment(-999, 33) == -330
expect:
  violations: ["orders/services/pricing.py:31"]
  fix: ready
  fix_file: orders/services/pricing.py
  pr_contains: ["- 규칙 재검사: 대상 위반 1건 해소, 새 위반 없음"]
