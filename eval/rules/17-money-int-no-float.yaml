name: money-int-no-float
description: >-
  README 금액 규칙("금액은 원 단위 정수(`int`)로 다룬다. `float`로 바꾸거나 `/`로 나누지 않고 `//`를
  쓴다.")의 타입 규칙 케이스. PR이 넣은 `float(...)`와 `/` 나눗셈은 잡히고, 같은 PR의 `//`는 잡히지
  않는다. 린터에 없는 팀 고유 규칙이다.
pr:
  - file: orders/services/pricing.py
    append: |


      def average_price(order: Order) -> int:
          count = len(order.items)
          amount = float(subtotal(order))
          return amount / count


      def half_fee() -> int:
          return SHIPPING_FEE // 2
model:
  rules:
    - section: 코드 규칙 > 금액
      quote: "금액은 원 단위 정수(`int`)로 다룬다. `float`로 바꾸거나 `/`로 나누지 않고 `//`를 쓴다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 금액 계산 코드가 아니라 기대값을 적는 코드다
      checker:
        body: |
          id: money-int
          language: python
          severity: error
          message: 금액은 int로 다루고 / 대신 // 를 쓴다
          rule:
            any:
              - pattern: float($$$ARGS)
              - kind: binary_operator
                has:
                  field: operator
                  regex: "^/$"
        examples:
          - {code: "x = float(total)\n", violates: true, lines: [1]}
          - {code: "half = amount / 2\n", violates: true, lines: [1]}
          - {code: "half = amount // 2\n", violates: false, lines: []}
          - {code: "x = int(total) * 3\n", violates: false, lines: []}
expect:
  violations: ["orders/services/pricing.py:32", "orders/services/pricing.py:33"]
  not_flagged: ["orders/services/pricing.py:37"]
  contains: ["출처: `README.md > 코드 규칙 > 금액`"]
