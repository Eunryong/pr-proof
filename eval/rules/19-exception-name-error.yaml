name: exception-name-error
description: >-
  base README에 더한 "예외 클래스 이름은 `Error`로 끝난다." 이름 규칙. PR이 정의한 `CouponRejected`는
  잡히고, `StockError` 정의와 `raise CouponRejected(...)`(사용처)는 잡히지 않는다.
base:
  - file: README.md
    find: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n"
    replace: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n\n### 예외\n\n- 예외 클래스 이름은 `Error`로 끝난다.\n"
pr:
  - file: orders/services/pricing.py
    append: |


      class CouponRejected(ValueError):
          pass


      class StockError(Exception):
          pass


      def reject() -> None:
          raise CouponRejected("coupon")
model:
  rules:
    - section: 코드 규칙 > 예외
      quote: "예외 클래스 이름은 `Error`로 끝난다."
      scope: []
      checker:
        body: |
          id: exception-name-error
          language: python
          severity: error
          message: 예외 클래스 이름은 Error로 끝난다
          rule:
            kind: class_definition
            all:
              - has:
                  field: superclasses
                  has:
                    regex: "(Error|Exception)$"
              - has:
                  field: name
                  kind: identifier
                  not:
                    regex: "Error$"
        examples:
          - {code: "class Bad(ValueError):\n    pass\n", violates: true, lines: [1]}
          - {code: "class Oops(Exception):\n    pass\n", violates: true, lines: [1]}
          - {code: "class OutOfStockError(Exception):\n    pass\n", violates: false, lines: []}
          - {code: "class Cart:\n    pass\n", violates: false, lines: []}
          - {code: "raise Bad('x')\n", violates: false, lines: []}
expect:
  violations: ["orders/services/pricing.py:30"]
  not_flagged: ["orders/services/pricing.py:34", "orders/services/pricing.py:39"]
  contains: ["출처: `README.md > 코드 규칙 > 예외`"]
