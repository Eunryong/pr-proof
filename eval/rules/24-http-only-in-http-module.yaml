name: http-only-in-http-module
description: >-
  base README에 더한 "다른 모듈은 `requests`를 import하지 않는다." 규칙. pricing.py와 handlers.py에
  PR이 넣은 `import requests`와 `from requests import ...`는 잡히고, 정해진 파일(orders/http.py)의
  import와 이름만 비슷한 모듈(`requests_cache_policy`)은 잡히지 않는다.
base:
  - file: README.md
    find: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n"
    replace: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n\n### HTTP\n\n- HTTP 호출은 `orders/http.py`만 한다. 다른 모듈은 `requests`를 import하지 않는다.\n"
  - file: orders/http.py
    create: "def get(url: str) -> bytes:\n    raise NotImplementedError(url)\n"
pr:
  - file: orders/services/pricing.py
    append: |


      def fetch_rate() -> int:
          import requests

          return requests.get("https://rates.invalid", timeout=5).json()["rate"]
  - file: orders/api/handlers.py
    append: |


      def session():
          from requests import Session
          from orders import requests_cache_policy

          return Session(), requests_cache_policy
  - file: orders/http.py
    append: |


      def client():
          import requests

          return requests
model:
  rules:
    - section: 코드 규칙 > HTTP
      quote: "HTTP 호출은 `orders/http.py`만 한다. 다른 모듈은 `requests`를 import하지 않는다."
      scope: []
      scope_exclude: ["orders/http.py"]
      scope_reason: HTTP 호출을 하라고 정한 파일 자체다
      checker:
        body: |
          id: no-requests-import
          language: python
          severity: error
          message: requests는 orders/http.py에서만 import한다
          rule:
            any:
              - kind: import_statement
                has:
                  kind: dotted_name
                  regex: "^requests(\\.|$)"
              - kind: import_from_statement
                has:
                  field: module_name
                  regex: "^requests(\\.|$)"
        examples:
          - {code: "import requests\n", violates: true, lines: [1]}
          - {code: "from requests import Session\n", violates: true, lines: [1]}
          - {code: "import requests.adapters\n", violates: true, lines: [1]}
          - {code: "import requests_cache_policy\n", violates: false, lines: []}
          - {code: "from orders import requests_cache_policy\n", violates: false, lines: []}
          - {code: "from orders.http import get\n", violates: false, lines: []}
expect:
  violations: ["orders/api/handlers.py:15", "orders/services/pricing.py:31"]
  not_flagged: ["orders/api/handlers.py:16", "orders/http.py:6"]
  contains: ["출처: `README.md > 코드 규칙 > HTTP`"]
