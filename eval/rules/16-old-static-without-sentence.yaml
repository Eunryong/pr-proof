name: old-static-without-sentence
description: >-
  완료 기준 2-2. base의 README에서 "비교에 쓰는 기준값은 숫자를 직접 쓰지 않는다" 문장을 지웠다. 옛
  static 01·02와 같은 PR(`> 50`과 모듈 수준 리스트)이다. 모델이 그 규칙을 답해도 원문 확인에서
  버려지므로 `> 50`은 위반으로 나오지 않는다. README에 남은 "함수는 모듈 수준 변수를 바꾸지 않는다"
  규칙은 그대로 검사한다. 파이프라인이 정한 규칙이 없으므로 그 문장이 없으면 매직 값은 아무도 보지
  않는다.
base:
  - file: README.md
    find: "- 비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다.\n"
    replace: ""
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
  - file: orders/services/pricing.py
    find: "MAX_COUPON_PERCENT = 50\n"
    replace: "MAX_COUPON_PERCENT = 50\n_seen_orders = []\n"
  - file: orders/services/pricing.py
    find: "def subtotal(order: Order) -> int:\n"
    replace: "def subtotal(order: Order) -> int:\n    _seen_orders.append(order)\n"
expect:
  violations: ["orders/services/pricing.py:10"]
  not_flagged: ["orders/services/pricing.py:15"]
  absent: ["비교에 쓰는 기준값"]
