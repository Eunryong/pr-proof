name: constants-location
description: >-
  base README에 더한 "모듈 상수(대문자 이름)는 `orders/constants.py`에 둔다." 위치 규칙. PR이
  pricing.py에 새로 둔 모듈 상수는 잡히고, constants.py에 더한 상수와 pricing.py에 원래 있던 상수(PR이
  바꾸지 않은 줄)는 잡히지 않는다. 함수 안의 대문자 이름 대입도 잡히지 않는다.
base:
  - file: README.md
    find: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n"
    replace: "### 테스트\n\n- 테스트 파일 이름은 `test_<모듈>.py`다.\n\n### 상수 위치\n\n- 모듈 상수(대문자 이름)는 `orders/constants.py`에 둔다.\n"
  - file: orders/constants.py
    create: "TAX_PERCENT = 10\n"
pr:
  - file: orders/services/pricing.py
    find: "MAX_COUPON_PERCENT = 50\n"
    replace: "MAX_COUPON_PERCENT = 50\nMAX_ITEMS = 100\n"
  - file: orders/services/pricing.py
    append: |


      def limit() -> int:
          LOCAL_LIMIT = 3
          return LOCAL_LIMIT
  - file: orders/constants.py
    append: "MIN_ORDER = 1_000\n"
model:
  rules:
    - section: 코드 규칙 > 상수 위치
      quote: "모듈 상수(대문자 이름)는 `orders/constants.py`에 둔다."
      scope: []
      scope_exclude: ["orders/constants.py"]
      scope_reason: 상수를 두라고 정한 파일 자체다
      checker:
        body: |
          id: constants-location
          language: python
          severity: error
          message: 모듈 상수는 orders/constants.py에 둔다
          rule:
            kind: expression_statement
            inside:
              kind: module
            has:
              kind: assignment
              has:
                field: left
                regex: "^[A-Z][A-Z0-9_]*$"
        examples:
          - {code: "LIMIT = 3\n", violates: true, lines: [1]}
          - {code: "MAX_N: int = 5\n", violates: true, lines: [1]}
          - {code: "def f():\n    LIMIT = 3\n    return LIMIT\n", violates: false, lines: []}
          - {code: "limit = 3\n", violates: false, lines: []}
expect:
  violations: ["orders/services/pricing.py:6"]
  not_flagged: ["orders/constants.py:2", "orders/services/pricing.py:32"]
  contains: ["출처: `README.md > 코드 규칙 > 상수 위치`"]
