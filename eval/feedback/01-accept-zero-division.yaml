name: accept-zero-division
description: >-
  받아들일 코멘트 (2026-11-22, DESIGN 4.11). PR이 더한 `average_quantity`는 빈 목록에서 0으로 나눈다.
  Copilot의 줄 코멘트가 그 줄을 가리키고 빈 목록을 막아 달라고 한다. 판단 모델이 받아들이고, 수정
  작성의 모델이 고치고, 출구 검사를 통과해 수정안 PR(pipeline/pr-1-fix-feedback)이 열린다. 그 스레드에
  "반영했습니다. 수정안 #N" 답글이 달리고 기록은 accepted와 그 번호다. 실제 모델로만 돈다. 호출을
  줄이려고 규칙 문서를 없는 파일로 둔다(규칙 읽기를 부르지 않는다).
real_only: true
pipeline:
  rules: {docs: [NO_RULES.md]}
pr:
  - file: orders/services/stats.py
    create: |
      def average_quantity(quantities: list[int]) -> float:
          total = sum(quantities)
          return total / len(quantities)
  - file: tests/test_stats.py
    create: |
      from orders.services.stats import average_quantity


      def test_average_quantity():
          assert average_quantity([1, 2, 3]) == 2
comment:
  path: orders/services/stats.py
  line: 3
  login: copilot-pull-request-reviewer
  association: NONE
  body: |
    `quantities`가 빈 목록이면 `len(quantities)`가 0이라 `ZeroDivisionError`가 납니다.
    빈 목록이면 `0.0`을 돌려주도록 막아 주세요.
expect:
  result: "feedback:fixed=1"
  verdict: accepted
  reply: "반영했습니다. 수정안 #"
  fix_file: orders/services/stats.py
