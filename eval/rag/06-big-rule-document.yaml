name: big-rule-document
description: >-
  5-6, 5-7(반대쪽). base의 README를 400KB가 넘는 문서로 바꾼다: 머리, 늘 읽는 "코드 규칙" 절, 규칙이
  아닌 설명 절 수백 개, 그리고 맨 끝에 `print` 규칙이 든 "주문 모듈" 절과 `Decimal` 규칙이 든 "결제
  모듈" 절. 검색을 켜면 제목 단위 조각이 저장소의 문서 컬렉션에 임베딩되고, PR이 바꾼 경로
  (orders/services/pricing.py)와 추가된 줄(print)로 찾은 "주문 모듈" 절이 읽혀 그 규칙이 PR의
  print를 잡는다. 결제 절과 설명 절은 읽지 않는다. 코멘트에 "규칙 문서가 커서 관련 절 N개만 읽음"과
  읽은 절의 목록이 나온다. 기준값은 가짜 임베딩 모델의 유사도에 맞춘 값이다.
fake_embed_only: true
pipeline:
  rag: {enabled: true, min_similarity: 0.4}
base:
  - file: README.md
    create_parts:
      - "# 주문 서비스 안내서\n\n이 문서는 저장소의 모든 것을 설명한다.\n\n## 코드 규칙\n\n코드 규칙은 아래 모듈별 절에 있다.\n\n"
      - repeat:
          times: 800
          text: "## 운영 메모 {n}\n\n이 절은 규칙이 아니라 운영 기록이다. 배포 날짜와 담당자, 회의에서 나온 이야기를 적어 둔다. 지난 분기의 장애 대응 과정과 연락 순서, 일정 조정 내용이 이어진다. 이 내용은 코드에 대한 약속이 아니다. 같은 내용이 여러 번 반복되어 문서가 길어졌다. 이 절은 규칙이 아니라 운영 기록이다. 배포 날짜와 담당자, 회의에서 나온 이야기를 적어 둔다. 지난 분기의 장애 대응 과정과 연락 순서, 일정 조정 내용이 이어진다.\n\n"
      - "## 주문 모듈\n\n- `orders/` 아래 모듈은 `print`를 쓰지 않는다.\n\n`orders/services/`의 서비스 코드(가격 계산 등)도 이 절의 규칙을 따른다.\n\n"
      - "## 결제 모듈\n\n- `payments/` 아래 모듈은 금액을 `Decimal`로 다룬다.\n"
pr:
  - file: orders/services/pricing.py
    find: "def discount(order: Order) -> int:\n"
    replace: "def discount(order: Order) -> int:\n    print(\"coupon\", order.coupon_percent)\n"
records: []
model:
  rules:
    - section: 주문 모듈
      quote: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
      scope: ["orders/**"]
      checker:
        body: |
          id: no-print
          language: python
          severity: error
          message: orders/ 아래 모듈은 print를 쓰지 않는다
          rule:
            pattern: print($$$ARGS)
        examples:
          - {code: "print(1)\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print('o', o)\n", violates: true, lines: [2]}
          - {code: "logger.info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
expect:
  violations: ["orders/services/pricing.py:13"]
  contains:
    - "규칙 문서가 커서 관련 절 "
    - "`README.md > 주문 모듈`"
    - "`README.md > 코드 규칙`"
    - "`rules.docs`"
    - "출처: `README.md > 주문 모듈`"
  absent: ["`README.md > 결제 모듈`", "`README.md > 운영 메모 7`"]
  doc_collection: true
