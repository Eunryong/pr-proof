name: below-threshold-only
description: >-
  5-10. 다른 규칙의 기록만 세 건(채택 둘, 거절 하나) 있고 모두 유사도 기준값에 못 미친다. 수정 판단과
  수정 작성의 프롬프트에 기록이 하나도 들어가지 않고(관련 없는 기록을 채워 넣지 않는다), 코멘트에는
  버린 후보의 개수만 나온다.
fake_embed_only: true
pipeline:
  rag: {enabled: true, min_similarity: 0.6}
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
records:
  - kind: adopted
    rule_text: "예외 클래스 이름은 `Error`로 끝난다."
    rule_id: R-readme-other0
    file: orders/errors0.py
    line_text: "class Boom(Exception):"
    context: "class Boom(Exception):\n    pass"
    diff: "-class Boom(Exception):\n+class Boom(Exception):  # 고침"
    pr_number: 80
    fix_pr_number: 90
  - kind: adopted
    rule_text: "`orders/models`의 데이터 클래스는 `@dataclass(frozen=True)`로 선언한다."
    rule_id: R-readme-other1
    file: orders/errors1.py
    line_text: "@dataclass"
    context: "@dataclass\n    pass"
    diff: "-@dataclass\n+@dataclass  # 고침"
    pr_number: 81
    fix_pr_number: 91
  - kind: rejected
    rule_text: "`orders/services`는 `orders/api`를 import하지 않는다."
    rule_id: R-readme-other2
    file: orders/errors2.py
    line_text: "import orders.api.handlers"
    context: "import orders.api.handlers\n    pass"
    diff: "-import orders.api.handlers\n+import orders.api.handlers  # 고침"
    pr_number: 82
    fix_pr_number: 92
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      scope: []
      scope_exclude: ["tests/**"]
      scope_reason: 테스트는 기대값을 숫자로 직접 적는 코드라 이 규칙의 대상이 아니다
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
fix:
  edits:
    - - file: orders/services/pricing.py
        find: "order.coupon_percent > 50"
        replace: "order.coupon_percent > MAX_COUPON_PERCENT"
  answer:
    summary: 쿠폰 비율의 상한 50을 원래 있던 MAX_COUPON_PERCENT로 되돌림
    changes:
      - {file: orders/services/pricing.py, line: 13, rule: 0, why: 비교의 기준값을 상수로 쓴다}
expect:
  violations: ["orders/services/pricing.py:13"]
  fix: ready
  fix_file: orders/services/pricing.py
  same_as_base: true
  prompt_records: {decide: 0, fix: 0}
  contains:
    - "<details><summary>참고한 과거 기록 0건</summary>"
    - "유사도 기준값에 못 미쳐 넣지 않은 후보: 수정 판단 3건, 수정 작성 2건"
