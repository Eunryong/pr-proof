name: search-off
description: >-
  5-8. `rag.enabled`를 적지 않은(기본 auto) base에 채택 기록이 한 건(기준 20건 미만) 쌓여 있다. 검사
  동안 chromadb·onnxruntime·tokenizers를 import하면 실패하게 막아 두고 끝까지 돈다(수정안 PR까지).
  `data_dir/chroma/`와 임베딩 모델 폴더(`data_dir/models/`)가 생기지 않고, 기록은 임베딩되지 않고,
  코멘트에 참고 기록도 검색 줄도 없다(기록이 적어 꺼진 것은 알리지 않는다, pr-proof#78).
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
records:
  - kind: adopted
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    file: orders/services/shipping1.py
    line_text: "if order.weight > 31:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 31:
              return 5000
    diff: |
      -    if order.weight > 31:
      +    if order.weight > MAX_WEIGHT_KG_1:
    pr_number: 61
    fix_pr_number: 71
expect:
  violations: ["orders/services/pricing.py:13"]
  fix: ready
  fix_file: orders/services/pricing.py
  blocked_imports: true
  chroma: false
  models_dir: false
  embedded: 0
  prompt_records: {decide: 0, fix: 0}
  absent: ["참고한 과거 기록", "검색:"]
