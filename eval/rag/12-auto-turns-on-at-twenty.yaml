name: auto-turns-on-at-twenty
description: >-
  6.7 "검색을 켜는 조건". `rag.enabled`를 적지 않은(기본 auto) base에 이 저장소의 채택·거절 기록이 딱
  20건 쌓였다(채택 10, 거절 10. 다른 저장소의 기록 5건은 세지 않는다). 검색이 켜져 위반이 없는 PR이어도
  검사 시작에서 `data_dir/chroma/`가 생기고 20건이 모두 임베딩되며, 코멘트에 상태와 숫자가 나온다.
  20건 미만이면 꺼지는 쪽은 `eval/rag/08`(1건)과 단위 테스트(19건)가 본다.
pr:
  - file: notes.txt
    create: "파이썬 파일을 바꾸지 않는 PR\n"
records:
  - &adopted
    kind: adopted
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    file: orders/services/shipping1.py
    line_text: "if order.weight > 31:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 31:
              return 5000
    diff: |
      -    if order.weight > 31:
      +    if order.weight > MAX_WEIGHT_KG_1:
    pr_number: 61
    fix_pr_number: 71
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - *adopted
  - &rejected
    kind: rejected
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    file: orders/services/shipping2.py
    line_text: "if order.weight > 32:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 32:
              return 5000
    diff: |
      -    if order.weight > 32:
      +    if order.weight > MAX_WEIGHT_KG_2:
    pr_number: 62
    fix_pr_number: 72
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - *rejected
  - &other
    kind: adopted
    repo: o/other
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    file: orders/services/shipping3.py
    line_text: "if order.weight > 33:"
    context: "if order.weight > 33:"
    diff: "-    if order.weight > 33:"
  - *other
  - *other
  - *other
  - *other
expect:
  violations: []
  chroma: true
  embedded: 20
  other_embedded: 0
  contains:
    - "검색: 켜짐 (자동, 채택·거절 기록 20/20건. 수정안 채택률 넣음 0/0, 넣지 않음 0/0. 넣음 30건, 넣지 않음 10건부터 비교)"
