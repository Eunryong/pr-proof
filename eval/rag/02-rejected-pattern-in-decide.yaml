name: rejected-pattern-in-decide
description: >-
  5-2. 같은 규칙의 위반을 상수로 바꾼 수정안을 사람이 닫은 거절 기록(다른 파일, shipping.py)을 넣고 검색을 켠다. PR의 `> 50`과 `>= 50_000`을
  묻는 수정 판단의 프롬프트에 그 거절 기록이 참고 자료로 들어간다. 모델이 그 기록 쪽으로 기우는지는 tests/e2e/test_rag_compare.py가 잰다.
pipeline:
  rag: {enabled: true}
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
  - file: orders/services/pricing.py
    find: "discount(order) >= FREE_SHIPPING_MIN"
    replace: "discount(order) >= 50_000"
records:
  - kind: rejected
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    file: orders/services/shipping1.py
    line_text: "if order.weight > 31:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 31:
              return 5000
    diff: |
      -    if order.weight > 31:
      +    if order.weight > MAX_WEIGHT_KG_1:
    pr_number: 61
    fix_pr_number: 71
expect:
  violations: ["orders/services/pricing.py:13", "orders/services/pricing.py:21"]
  contains:
    - "- 기록 1 · 거절 · 원래 PR #61 · 수정안 PR #71 · 규칙 `R-readme-"
    - "· 수정 판단"
