name: five-similar-records
description: >-
  5-11. 같은 규칙을 같은 방식으로 고친 채택 기록이 다섯 건이고 모두 기준값을 넘는다. 수정 판단과 수정
  작성의 프롬프트에는 `rag.max_records`(3)건만 들어가고 코멘트에도 세 건이 보인다.
fake_embed_only: true
pipeline:
  rag: {enabled: true, min_similarity: 0.6}
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
records:
  - kind: adopted
    rule: 0
    file: orders/services/shipping1.py
    line_text: "if order.weight > 31:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 31:
              return 5000
    diff: |
      -    if order.weight > 31:
      +    if order.weight > MAX_WEIGHT_KG_1:
    pr_number: 61
    fix_pr_number: 71
  - kind: adopted
    rule: 0
    file: orders/services/shipping2.py
