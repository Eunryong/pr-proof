name: other-repo-not-searched
description: >-
  5-3. 같은 규칙, 같은 모양의 채택·거절 기록을 다른 저장소(x/other)의 것으로만 넣고 검색을 켠다. 검색은
  이 저장소의 컬렉션만 열므로(저장소마다 컬렉션이 따로다) 어느 프롬프트에도 기록이 들어가지 않고, 다른
  저장소의 기록은 임베딩되지도 않는다.
pipeline:
  rag: {enabled: true}
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
records:
  - kind: adopted
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    repo: x/other
    file: orders/services/shipping1.py
    line_text: "if order.weight > 31:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 31:
              return 5000
    diff: |
      -    if order.weight > 31:
      +    if order.weight > MAX_WEIGHT_KG_1:
    pr_number: 61
    fix_pr_number: 71
  - kind: rejected
    rule_text: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
    repo: x/other
    file: orders/services/shipping2.py
    line_text: "if order.weight > 32:"
    context: |
      def shipping_fee(order: Order) -> int:
          if order.weight > 32:
              return 5000
    diff: |
      -    if order.weight > 32:
      +    if order.weight > MAX_WEIGHT_KG_2:
    pr_number: 62
    fix_pr_number: 72
expect:
  violations: ["orders/services/pricing.py:13"]
  fix: ready
  fix_file: orders/services/pricing.py
  prompt_records: {decide: 0, fix: 0}
  absent: ["참고한 과거 기록"]
  chroma: true
  other_embedded: 0
