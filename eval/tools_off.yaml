name: tools-off
description: >-
  도구를 끈 평가 (docs/DESIGN.md 13절, 완료 기준 1-16, 3-7, 3-8, 4-8). 같은 규칙 읽기 결과로 모델
  판단만, 도구 끔(검사기, 안 되면 모델 판단), 도구 켬(도구 선택이 문서 규칙을 ruff 코드로 이을 수
  있음)을 돌려 개념마다, 확인 방법(도구 / 검사기 / 모델 판단)마다 재현율·정밀도를 낸다. 표본은 1단계
  기준선과 같은 옛 static 다섯 케이스(지금의 rules 09–12, 15), lint 다섯 케이스, 아래 probe(ruff가
  정답지)와, 아래 판단 케이스(케이스가 표시한 줄이 정답), 그리고 (주면) MathLLM base 전체다.
  `tests/e2e/test_tools_off_eval.py`가 읽는다.
# 개념: ruff 코드가 정답지다. 원문에 needle이 든 문서 규칙들이 잡은 줄을 그 코드의 정답과 비교한다.
# scope가 있으면 정답을 그 안(문서가 밝힌 범위)의 줄로 줄인다. 비면 저장소 전체 (1단계 기준선과 같음)
concepts:
  eval:
    - {code: PLR2004, needle: 비교에 쓰는 기준값}
    - {code: PLW0603, needle: global}
    - {code: T201, needle: "`print`", scope: ["orders/**"]}
  mathllm:
    - {code: PLR2004, needle: 비교에 쓰는 기준값}
    - {code: T201, needle: "`print`", scope: ["src/data_creator/**"]}
# 모델 판단 쪽 표본 (4-8). ruff에 없는 규칙이라 정답은 케이스 파일의 `expect.violations`(케이스를 쓴
# 사람이 표시한 줄)다. 케이스의 base(README에 그 규칙 하나)와 PR을 그대로 쓴다.
# 03(지시 주석)은 정답을 일부러 정하지 않은 기록용 케이스라 넣지 않는다
judge_cases:
  - {case: judge/01-verb-function-name.yaml, needle: 동사로 시작}
  - {case: judge/06-comment-matches-code.yaml, needle: 주석은}
cases:
  - lint/01-unused-import.yaml
  - lint/02-existing-violation-untouched.yaml
  - lint/03-unfixable-only.yaml
  - lint/04-failing-tests-block-fix.yaml
  - lint/05-fstring-after-korean.yaml
  - rules/09-old-static-01-magic-value-fix.yaml
  - rules/10-old-static-02-global-state-fix.yaml
  - rules/11-old-static-04-fix-breaks-tests.yaml
  - rules/12-old-static-03-uncovered.yaml
  - rules/15-old-static-05-failing-tests.yaml
# 1단계 기준선이 쓴 위반 파일 (그때 "비교에 쓴 위반 파일의 줄")
probe:
  - file: orders/services/probe.py
    create: |
      import logging
      from orders.api import handlers
      import orders.api.handlers
      from orders.models.order import Order

      LIMIT = 10
      counter = 0


      def f(order: Order, x: int) -> int:
          print("x")
          if x > 50:
              pass
          if x > 0 or x == 100 or x == 1:
              pass
          if x >= LIMIT:
              pass
          global counter
          counter += 1
          price = float(order.total)
          half = order.total / 2
          logging.getLogger(__name__).info("%s %s %s", handlers, price, half)
          return order.total // 2
  - file: orders/models/probe_model.py
    create: |
      from dataclasses import dataclass

      from orders.services import pricing


      @dataclass
      class A:
          x: int = pricing.SHIPPING_FEE


      @dataclass(frozen=True)
      class B:
          x: int
