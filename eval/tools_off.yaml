name: tools-off
description: >-
  도구를 끈 평가 (docs/DESIGN.md 13절, 완료 기준 1-16, 3-7, 3-8, 4-8). 같은 규칙 읽기 결과로 모델
  판단만, 도구 끔(검사기, 안 되면 모델 판단), 도구 켬(도구 선택이 문서 규칙을 ruff 코드로 이을 수
  있음)을 돌려 개념마다, 확인 방법(도구 / 검사기 / 모델 판단)마다 재현율·정밀도를 낸다. 표본은 1단계
  기준선과 같은 옛 static 다섯 케이스(지금의 rules 09–12, 15), lint 다섯 케이스, 아래 probe(ruff가
  정답지)와, 아래 판단 케이스(케이스가 표시한 줄이 정답), 그리고 (주면) MathLLM base 전체다.
  `tests/e2e/test_tools_off_eval.py`가 읽는다.
# 개념: ruff 코드가 정답지다. 원문에 needle이 든 문서 규칙들이 잡은 줄을 그 코드의 정답과 비교한다.
# scope가 있으면 정답을 그 안(문서가 밝힌 범위)의 줄로 줄인다. 비면 저장소 전체 (1단계 기준선과 같음)
concepts:
  eval:
    - {code: PLR2004, needle: 비교에 쓰는 기준값}
    - {code: PLW0603, needle: global}
    - {code: T201, needle: "`print`", scope: ["orders/**"]}
  mathllm:
    - {code: PLR2004, needle: 비교에 쓰는 기준값}
    - {code: T201, needle: "`print`", scope: ["src/data_creator/**"]}
# 모델 판단 쪽 표본 (4-8). ruff에 없는 규칙이라 정답은 케이스 파일의 `expect.violations`(케이스를 쓴
# 사람이 표시한 줄)다. 케이스의 base(README에 그 규칙 하나)와 PR을 그대로 쓰고, 가짜 모델의 답도
# 케이스의 것을 쓴다. 03(지시 주석)은 정답을 일부러 정하지 않은 기록용 케이스라 넣지 않는다
judge_cases:
  - {case: judge/01-verb-function-name.yaml, needle: 동사로 시작}
  - {case: judge/06-comment-matches-code.yaml, needle: 주석은}
cases:
  - lint/01-unused-import.yaml
  - lint/02-existing-violation-untouched.yaml
  - lint/03-unfixable-only.yaml
  - lint/04-failing-tests-block-fix.yaml
  - lint/05-fstring-after-korean.yaml
  - rules/09-old-static-01-magic-value-fix.yaml
  - rules/10-old-static-02-global-state-fix.yaml
  - rules/11-old-static-04-fix-breaks-tests.yaml
  - rules/12-old-static-03-uncovered.yaml
  - rules/15-old-static-05-failing-tests.yaml
# 1단계 기준선이 쓴 위반 파일 (그때 "비교에 쓴 위반 파일의 줄")
probe:
  - file: orders/services/probe.py
    create: |
      import logging
      from orders.api import handlers
      import orders.api.handlers
      from orders.models.order import Order

      LIMIT = 10
      counter = 0


      def f(order: Order, x: int) -> int:
          print("x")
          if x > 50:
              pass
          if x > 0 or x == 100 or x == 1:
              pass
          if x >= LIMIT:
              pass
          global counter
          counter += 1
          price = float(order.total)
          half = order.total / 2
          logging.getLogger(__name__).info("%s %s %s", handlers, price, half)
          return order.total // 2
  - file: orders/models/probe_model.py
    create: |
      from dataclasses import dataclass

      from orders.services import pricing


      @dataclass
      class A:
          x: int = pricing.SHIPPING_FEE


      @dataclass(frozen=True)
      class B:
          x: int
# 가짜 모델의 답 (실제 모델로 돌리면 쓰지 않는다). 도구 선택은 `tool`이 없으면 맞는 도구 없음.
# `judge`는 모델 판단의 답이다(그 파일을 물을 때만 낸다)
model:
  rules:
    - section: 코드 규칙 > 상수
      quote: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
      checker:
        body: |
          id: no-magic-number-in-comparison
          language: python
          severity: error
          message: 비교의 기준값은 대문자 이름의 모듈 상수로 둔다
          rule:
            any:
              - kind: integer
              - kind: float
            inside:
              kind: comparison_operator
            not:
              regex: "^(0|1|100)$"
        examples:
          - {code: "if price > 50:\n    pass\n", violates: true, lines: [1]}
          - {code: "ok = total >= 50_000\n", violates: true, lines: [1]}
          - {code: "if n > 0:\n    pass\n", violates: false, lines: []}
          - {code: "full = percent == 100\n", violates: false, lines: []}
      judge:
        - {file: orders/services/probe.py, line: 12, quote: "if x > 50:", why: 비교에 숫자를 직접 씀}
    - section: 코드 규칙 > 상수
      quote: "함수는 모듈 수준 변수를 바꾸지 않는다. `global` 문을 쓰지 않는다."
      checker:
        body: |
          id: no-global
          language: python
          severity: error
          message: global 문을 쓰지 않는다
          rule:
            kind: global_statement
        examples:
          - {code: "count = 0\n\n\ndef bump():\n    global count\n    count += 1\n", violates: true, lines: [5]}
          - {code: "def f():\n    global total\n    total = 1\n", violates: true, lines: [2]}
          - {code: "def f(items):\n    items.append(1)\n    return items\n", violates: false, lines: []}
          - {code: "count = 0\n", violates: false, lines: []}
      judge:
        - {file: orders/services/probe.py, line: 18, quote: "global counter", why: global 문}
        - {file: orders/services/probe.py, line: 19, quote: "counter += 1", why: 모듈 수준 변수를 바꿈}
    - section: 코드 규칙 > 출력
      quote: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
      scope: ["orders/**"]
      checker:
        body: |
          id: no-print
          language: python
          severity: error
          message: orders/ 아래 모듈은 print를 쓰지 않는다
          rule:
            pattern: print($$$ARGS)
        examples:
          - {code: "print(1)\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print('o', o)\n", violates: true, lines: [2]}
          - {code: "logger.info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
      tool:
        tool: ruff
        codes: [T201]
        reason: T201이 print 호출을 잡는다
        examples:
          - {code: "print('x')\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print(o)\n", violates: true, lines: [2]}
          - {code: "import logging\nlogging.getLogger(__name__).info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
