# 검색 품질 평가 세트 (docs/DESIGN.md 6.7 "recall@k", 13절 5단계의 기준값 정하기).
# 기록 하나는 (규칙, 종류, 위반 줄과 앞뒤 줄)이고, 질의는 다른 파일의 새 위반이다. 질의마다 "꺼내야 할
# 기록"은 같은 규칙의 기록이다(같은 규칙을 같은 방식으로 고친 채택 기록과 같은 패턴의 거절 기록).
# 그 밖의 기록(다른 규칙)과의 유사도가 "관련 없는 짝"의 분포다. 규칙 원문은 예제 리포 README의 규칙과
# 같은 모양으로 썼다. tests/worker/test_real_embed.py가 읽는다(PR_PROOF_REAL_EMBED=1).
rules:
  print: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
  import: "`orders/services`는 `orders/api`를 import하지 않는다."
  frozen: "`orders/models`의 데이터 클래스는 `@dataclass(frozen=True)`로 선언한다."
  magic: "비교에 쓰는 기준값(금액, 비율의 상한)은 숫자를 직접 쓰지 않고 대문자 이름의 모듈 상수로 둔다. `0`, `1`, 퍼센트 계산의 `100`은 예외다."
  global: "함수는 모듈 수준 변수를 바꾸지 않는다. `global` 문을 쓰지 않는다."
  error: "예외 클래스 이름은 `Error`로 끝난다."
  decimal: "금액은 `float`가 아니라 `Decimal`로 다룬다."
records:
  - {id: p1, rule: print, kind: adopted, context: "def place(order):\n    total = subtotal(order)\n    print('placed', order.id)\n    return total"}
  - {id: p2, rule: print, kind: rejected, context: "def cancel(order):\n    print(f'cancel {order.id}')\n    order.status = 'cancelled'"}
  - {id: p3, rule: print, kind: failed, context: "def refund(order):\n    print('refund', order.total)\n    return order.total"}
  - {id: i1, rule: import, kind: adopted, context: "from orders.models.order import Order\nfrom orders.api.handlers import quote\n\n\ndef total(order):"}
  - {id: i2, rule: import, kind: rejected, context: "import orders.api.schema\nfrom orders.models.item import Item"}
  - {id: f1, rule: frozen, kind: adopted, context: "from dataclasses import dataclass\n\n\n@dataclass\nclass Item:\n    sku: str\n    quantity: int"}
  - {id: f2, rule: frozen, kind: rejected, context: "@dataclass(order=True)\nclass Coupon:\n    code: str\n    percent: int"}
  - {id: m1, rule: magic, kind: adopted, context: "def discount(order):\n    if order.coupon_percent > 50:\n        raise ValueError('coupon')\n    return order.total"}
  - {id: m2, rule: magic, kind: rejected, context: "def shipping_fee(order):\n    if order.weight > 30:\n        return 5000\n    return 3000"}
  - {id: m3, rule: magic, kind: failed, context: "def is_free(order):\n    return order.total >= 50_000"}
  - {id: g1, rule: global, kind: adopted, context: "_seen = []\n\n\ndef remember(order):\n    _seen.append(order)\n    return len(_seen)"}
  - {id: g2, rule: global, kind: rejected, context: "counter = 0\n\n\ndef bump():\n    global counter\n    counter += 1"}
  - {id: e1, rule: error, kind: adopted, context: "class CouponInvalid(Exception):\n    pass"}
  - {id: e2, rule: error, kind: rejected, context: "class StockOut(ValueError):\n    \"\"\"재고 없음\"\"\""}
  - {id: d1, rule: decimal, kind: adopted, context: "def unit_price(item):\n    return float(item.price) * 1.1"}
  - {id: d2, rule: decimal, kind: rejected, context: "total = 0.0\nfor item in order.items:\n    total += item.price"}
queries:
  - {rule: print, context: "def ship(order):\n    print('shipping', order.address)\n    send(order)", expect: [p1, p2, p3]}
  - {rule: import, context: "from orders.api.handlers import render\nfrom orders.models.order import Order", expect: [i1, i2]}
  - {rule: frozen, context: "@dataclass\nclass Address:\n    city: str\n    zip_code: str", expect: [f1, f2]}
  - {rule: magic, context: "def can_split(order):\n    if len(order.items) > 20:\n        return False\n    return True", expect: [m1, m2, m3]}
  - {rule: global, context: "_cache = {}\n\n\ndef price_of(sku):\n    _cache[sku] = lookup(sku)\n    return _cache[sku]", expect: [g1, g2]}
  - {rule: error, context: "class PaymentDeclined(Exception):\n    pass", expect: [e1, e2]}
  - {rule: decimal, context: "def tax(order):\n    return order.total * 0.1", expect: [d1, d2]}
