name: pr-cap-grows-with-violations
description: >-
  4-5 뒤 절, 4-6. base의 `.pipeline.yaml`이 `pr_base: 0`, `per_violation: 1`, `pr_max: 3`이다. 위반이
  없으면 PR 상한이 0이라 모델 판단을 하나도 못 하지만, 검사기가 `print` 위반 5건을 찾아 PR 상한이 위반
  수만큼 늘고 `pr_max` 3에서 멈춘다. 새 파일 다섯 개 중 세 파일만 모델 판단을 하고, 판단하지 못한 규칙
  수가 코멘트에 나온다. `/fix`가 PR 상한을 한 번 더 받아 남은 두 파일을 판단한다. 새 파일은 테스트가
  지나가지 않아 수정 판단의 표가 모두 skip한다(수정까지 가지 않는다).
scripted_only: true
pipeline:
  model:
    calls:
      pr_base: 0
      per_violation: 1
      pr_max: 3
base:
  - file: README.md
    create: |
      # orders

      ## 코드 규칙

      ### 출력

      - `orders/` 아래 모듈은 `print`를 쓰지 않는다.

      ### 이름

      - 함수 이름은 하는 일을 동사로 시작한다.
pr:
  - {file: orders/services/m1.py, create: "def total():\n    print(1)\n"}
  - {file: orders/services/m2.py, create: "def total():\n    print(2)\n"}
  - {file: orders/services/m3.py, create: "def total():\n    print(3)\n"}
  - {file: orders/services/m4.py, create: "def total():\n    print(4)\n"}
  - {file: orders/services/m5.py, create: "def total():\n    print(5)\n"}
model:
  rules:
    - section: 코드 규칙 > 출력
      quote: "`orders/` 아래 모듈은 `print`를 쓰지 않는다."
      scope: ["orders/**"]
      checker:
        body: |
          id: no-print
          language: python
          severity: error
          message: orders/ 아래 모듈은 print를 쓰지 않는다
          rule:
            pattern: print($$$ARGS)
        examples:
          - {code: "print(1)\n", violates: true, lines: [1]}
          - {code: "def f(o):\n    print('o', o)\n", violates: true, lines: [2]}
          - {code: "logger.info('x')\n", violates: false, lines: []}
          - {code: "pprint_name = 1\n", violates: false, lines: []}
    - section: 코드 규칙 > 이름
      quote: "함수 이름은 하는 일을 동사로 시작한다."
      checker:
        body: |
          id: verb-first
          language: python
          severity: error
          message: 함수 이름은 동사로 시작한다
          rule:
            kind: lambda
        examples:
          - {code: "def total(order):\n    return 1\n", violates: true, lines: [1]}
          - {code: "def amount():\n    pass\n", violates: true, lines: [1]}
          - {code: "def get_total(order):\n    return 1\n", violates: false, lines: []}
          - {code: "def compute():\n    pass\n", violates: false, lines: []}
      judge:
        - {file: orders/services/m1.py, line: 1, quote: "def total():", why: 명사로 시작한다}
        - {file: orders/services/m2.py, line: 1, quote: "def total():", why: 명사로 시작한다}
        - {file: orders/services/m3.py, line: 1, quote: "def total():", why: 명사로 시작한다}
        - {file: orders/services/m4.py, line: 1, quote: "def total():", why: 명사로 시작한다}
        - {file: orders/services/m5.py, line: 1, quote: "def total():", why: 명사로 시작한다}
expect:
  violations:
    - "orders/services/m1.py:1"
    - "orders/services/m1.py:2"
    - "orders/services/m2.py:1"
    - "orders/services/m2.py:2"
    - "orders/services/m3.py:1"
    - "orders/services/m3.py:2"
    - "orders/services/m4.py:2"
    - "orders/services/m5.py:2"
  judge_calls: 3
  contains:
    - "모델 호출 상한에 걸려 처리하지 못함: 위반 판단 1개 규칙 (hunk 2개, `호출 상한: PR 상한 (3/3회 사용, 이 호출 1회)`)"
    - "`/fix`로 다시 돌릴 수 있습니다."
  then_fix:
    command: /fix
    result: "fix:no_targets"
    judge_calls: 5
    violations:
      - "orders/services/m1.py:1"
      - "orders/services/m1.py:2"
      - "orders/services/m2.py:1"
      - "orders/services/m2.py:2"
      - "orders/services/m3.py:1"
      - "orders/services/m3.py:2"
      - "orders/services/m4.py:1"
      - "orders/services/m4.py:2"
      - "orders/services/m5.py:1"
      - "orders/services/m5.py:2"
    absent: ["위반 판단"]
