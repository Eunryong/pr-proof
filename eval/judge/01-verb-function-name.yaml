name: verb-function-name
description: >-
  4-1, 4-2. README에 "함수 이름은 하는 일을 동사로 시작한다."만 적은 base. 검사기 작성은 두 번 모두
  예시를 통과하지 못해(가짜 검사기는 아무 줄도 잡지 않는다) 세 번째 회차 없이 그 규칙이 모델 판단으로
  간다(4.4 "의미 규칙을 모델 판단으로 보내는 때"). PR이
  pricing.py에 더한 `_line_amount`가 `found_by: model` 위반으로 나오고, 수정 판단과 모델 수정을 거쳐
  수정안 PR까지 가며 본문에 "도구로 재검사하지 못함"이 적힌다. 같은 hunk를 가진 다음 커밋(다른 파일만
  바꿈)은 모델 판단을 부르지 않고 같은 답을 쓴다.
  coverage를 묻기 전의 실제 모델(sonnet)로는 검사기 작성이 동사 목록을 둔 Python AST 스크립트로 예시를
  통과해(2026-11-20, 2/2) 이 규칙이 모델 판단까지 오지 않았다. coverage를 물은 뒤로는 도구를 끈 평가에서
  4/4 none으로 답해 모델 판단으로 갔다(같은 날). 이 케이스는 가짜 모델로만 보고, 실제 모델의 모델
  판단은 06이 본다.
scripted_only: true
base:
  - file: README.md
    create: |
      # orders

      파이프라인 평가용 예제 리포다.

      ## 코드 규칙

      ### 이름

      - 함수 이름은 하는 일을 동사로 시작한다.
pr:
  - file: orders/services/pricing.py
    find: "def subtotal(order: Order) -> int:\n    return sum(item.unit_price * item.quantity for item in order.items)\n"
    replace: "def _line_amount(item) -> int:\n    return item.unit_price * item.quantity\n\n\ndef subtotal(order: Order) -> int:\n    return sum(_line_amount(item) for item in order.items)\n"
model:
  rules:
    - section: 코드 규칙 > 이름
      quote: "함수 이름은 하는 일을 동사로 시작한다."
      checker:
        body: |
          id: verb-first
          language: python
          severity: error
          message: 함수 이름은 동사로 시작한다
          rule:
            kind: lambda
        examples:
          - {code: "def total(order):\n    return 1\n", violates: true, lines: [1]}
          - {code: "def amount():\n    pass\n", violates: true, lines: [1]}
          - {code: "def get_total(order):\n    return 1\n", violates: false, lines: []}
          - {code: "def compute():\n    pass\n", violates: false, lines: []}
      judge:
        - {file: orders/services/pricing.py, line: 8, quote: "def _line_amount(item) -> int:", why: 이름이 명사구로 시작한다}
fix:
  edits:
    - - file: orders/services/pricing.py
        find: "def _line_amount("
        replace: "def _compute_line_amount("
      - file: orders/services/pricing.py
        find: "sum(_line_amount("
        replace: "sum(_compute_line_amount("
  answer:
    summary: 줄 금액 함수의 이름을 동사로 시작하게 바꿈
    changes:
      - {file: orders/services/pricing.py, rule: 0, why: 함수 이름을 동사로 시작하게 바꾸고 부르는 곳도 바꾼다}
expect:
  violations: ["orders/services/pricing.py:8"]
  contains:
    - "모델 판단 (검사기가 예시 확인을 두 번 통과하지 못함)"
    - "모델 판단: 규칙 1개, hunk 1개"
  fix: ready
  fix_file: orders/services/pricing.py
  pushed_contains: ["def _compute_line_amount(item) -> int:"]
  pr_contains: ["이 규칙은 도구로 재검사하지 못함"]
  next_commit:
    edits:
      - {file: notes.txt, create: "다음 커밋은 파이썬 파일을 바꾸지 않는다\n"}
    contains: ["모델 호출 0회 · 저장된 판단 1건 사용"]
