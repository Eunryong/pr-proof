name: verb-function-name
description: >-
  4-1, 4-2. README에 "함수 이름은 하는 일을 동사로 시작한다."만 적은 base. PR이 pricing.py에 더한 `_line_amount`가 위반이고, 수정
  판단과 모델 수정을 거쳐 수정안 PR까지 간다. 같은 hunk를 가진 다음 커밋(다른 파일만 바꿈)은 모델 판단을 다시 부르지 않고 같은 답을 쓴다. 검사기 작성 모델이
  검사기를 쓸지 모델 판단으로 보낼지는 모델이 정한다.
base:
  - file: README.md
    create: |
      # orders

      파이프라인 평가용 예제 리포다.

      ## 코드 규칙

      ### 이름

      - 함수 이름은 하는 일을 동사로 시작한다.
pr:
  - file: orders/services/pricing.py
    find: "def subtotal(order: Order) -> int:\n    return sum(item.unit_price * item.quantity for item in order.items)\n"
    replace: "def _line_amount(item) -> int:\n    return item.unit_price * item.quantity\n\n\ndef subtotal(order: Order) -> int:\n    return sum(_line_amount(item) for item in order.items)\n"
expect:
  violations: ["orders/services/pricing.py:8"]
  contains:
    - "모델 판단: 규칙 1개, 바뀐 곳 1군데"
  fix: ready
  fix_file: orders/services/pricing.py
  pushed_contains: ["def _compute_line_amount(item) -> int:"]
  pr_contains: ["이 규칙은 도구로 재검사하지 못함"]
  next_commit:
    edits:
      - {file: notes.txt, create: "다음 커밋은 파이썬 파일을 바꾸지 않는다\n"}
    contains: ["모델 호출 0회 · 저장된 판단 1건 사용"]
