name: commit-format
description: 4-11. README의 기여 방법에 커밋 형식 규칙(문서에 지키는 예와 어기는 예가 있음)과 orders/models/ 본문 규칙이 있다. PR의 커밋 넷 중
  둘(1번, 3번)만 형식을 어긴다. 형식을 어긴 커밋만 전체 해시로 잡히고 지킨 커밋은 잡히지 않는다. 코드 규칙이 없어 수정 판단도 수정안도 없다(4-13). PR은 orders/models/를
  바꾸지 않아 본문 규칙은 해당 없음이다.
base:
- file: README.md
  create: "# orders\n\n파이프라인 평가용 예제 리포다.\n\n## 기여 방법\n\n- 커밋 메시지의 첫 줄은 `feat: `, `fix: `, `docs: ` 중 하나로\
    \ 시작한다.\n\n  지키는 예:\n\n  ```text\n  feat: 쿠폰 모델 추가\n  ```\n\n  어기는 예:\n\n  ```text\n  쿠폰 모델 추가\n \
    \ ```\n\n- `orders/models/` 아래 파일을 바꾸는 PR은 본문에 `## 데이터 변경` 절을 두고 무엇이 바뀌는지 적는다.\n"
pr_commits:
- message: 'feat: 쿠폰 계산 추가'
  edits:
  - file: orders/services/coupon.py
    create: "def coupon_amount(total: int, rate: int) -> int:\n    return total * rate // 100\n"
- message: 쿠폰 금액 반올림 고침
  edits:
  - file: orders/services/coupon.py
    create: "def coupon_amount(total: int, rate: int) -> int:\n    return (total * rate + 50) // 100\n"
- message: 'docs: 쿠폰 설명


    계산 방법을 적는다'
  edits:
  - file: docs/coupon.md
    create: '# 쿠폰


      금액의 퍼센트를 깎는다.

      '
- message: WIP
  edits:
  - file: docs/coupon.md
    append: '

      반올림한다.

      '
pr_text:
  title: 쿠폰 계산
  body: 쿠폰 금액을 계산하는 함수를 더했습니다.
expect:
  pr_flagged:
  - commit:1
  - commit:3
  no_fix: true
  pr_contains:
  - 커밋 4개
  - PR 패턴 (커밋 제목이
  - 이 PR은 바뀐 파일이 조건에 맞지 않아 해당 없음
  contains:
  - "**PR 단위:** ⚠️ 위반 2건 (규칙 1개)"
