name: body-present
description: 4-12의 반대쪽. orders/models/ 아래 파일을 바꾸고 본문에 '## 데이터 변경' 절이 있다. 잡히지 않는다.
base:
- file: README.md
  create: "# orders\n\n파이프라인 평가용 예제 리포다.\n\n## 기여 방법\n\n- 커밋 메시지의 첫 줄은 `feat: `, `fix: `, `docs: ` 중 하나로\
    \ 시작한다.\n\n  지키는 예:\n\n  ```text\n  feat: 쿠폰 모델 추가\n  ```\n\n  어기는 예:\n\n  ```text\n  쿠폰 모델 추가\n \
    \ ```\n\n- `orders/models/` 아래 파일을 바꾸는 PR은 본문에 `## 데이터 변경` 절을 두고 무엇이 바뀌는지 적는다.\n"
pr_commits:
- message: 'feat: 쿠폰 모델 추가'
  edits:
  - file: orders/models/coupon.py
    create: "from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass Coupon:\n    code:\
      \ str\n    amount: int\n"
pr_text:
  title: 쿠폰 모델
  body: '쿠폰 모델을 더했습니다.


    ## 데이터 변경

    쿠폰(code, amount)을 더함'
expect:
  pr_flagged: []
  pr_contains:
  - 'PR 단위 규칙 중 위반 없음:'
  contains:
  - "**규칙:** ✅ 위반 없음 · 규칙 2개를 확인함"
