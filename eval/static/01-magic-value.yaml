name: magic-value
description: PR이 상수 대신 매직 값 50을 썼다(PLR2004). 테스트가 지나가는 줄이라 /fix static을 제안하고, 상수로 되돌린 수정안을 검증해 올린다.
pr:
  - file: orders/services/pricing.py
    find: "order.coupon_percent > MAX_COUPON_PERCENT"
    replace: "order.coupon_percent > 50"
ai:  # 가짜 AI가 회차마다 적용할 편집 (실제 claude로 돌리면 쓰지 않는다)
  - - file: orders/services/pricing.py
      find: "order.coupon_percent > 50"
      replace: "order.coupon_percent > MAX_COUPON_PERCENT"
expect:
  findings: [PLR2004]
  proposal: approval
  fix: ready
  file: orders/services/pricing.py
  same_as_base: true
